name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libpcl-dev libyaml-cpp-dev libgtest-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke run on the bundled sequence
        run: ./build/lidar_od_run --data data/sequence_01 --out output --frames 22

  ros2:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies with rosdep
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths ros2 --ignore-src -y --rosdistro ${{ matrix.distro }}
      - name: Build the ROS 2 package
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --base-paths ros2 --event-handlers console_direct+

  api-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen
      - name: Build the API reference (fails on undocumented members)
        run: mkdir -p build/doc && doxygen Doxyfile
